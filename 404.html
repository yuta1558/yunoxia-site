<!DOCTYPE html>
<html class="no-js" lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Resolve all relative paths from the site root, since this page is served at arbitrary URLs -->
  <base href="/" />

  <title>404 - yunoxia.one</title>
  <meta name="description" content="お探しのページは見つかりませんでした。" />
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />

  <meta name="theme-color" content="#8b7ec8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#a599d4" media="(prefers-color-scheme: dark)" />

  <script>
    (function () {
      try {
        const stored = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = stored || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Sora:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header data-include="partials/header.html"></header>

  <main id="pjax-container" role="main">
    <section class="page fade-in">
      <h2 class="text-gradient">404</h2>
      <p>お探しのページは見つかりませんでした。</p>

      <div style="margin-top: 4rem; text-align: center; padding: 4rem 2rem;">
        <div style="font-size: 2rem; margin-bottom: 1.5rem; opacity: 0.4;" aria-hidden="true">⊘</div>
        <p style="color: var(--muted); font-size: 0.875rem; font-weight: 300; margin-bottom: 2rem;">
          URLが変更されたか、ページが削除された可能性があります。
        </p>
        <a href="index.html" style="color: var(--accent); letter-spacing: 0.08em;">Home へ戻る</a>
      </div>
    </section>
  </main>

  <footer data-include="partials/footer.html"></footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
